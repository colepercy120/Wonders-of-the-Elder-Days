 ### Intro
 
 wed_intro.01.t: "The Downfall of Aranórë."
 wed_intro.01.desc: "It's been almost 2000 years since the [courtofaranore|E] was shattered by an alliance of the [wizards|E] [alatarcharacter|e] and [pallandocharacter|e], the [kinnlai|e], and my twin brother [GetScriptedCharacterByHistoryID('lineofardana3').GetFirstName]. At our very moment of triumph, when [ariencharacter|e] and [tilioncharacter|e] were in reach, they attacked the Citadel and slew my mother [GetScriptedCharacterByHistoryID('lineofardana1').GetFirstName] along with most of the other lords of the court. \n\nSince that disaster, the plan to free the lord [melkorcharacter|e] from his prison beyond the world has been little more than a dream. But now [sauroncharacter|e] is once again rising in the east, and the forces arrayed against us have grown divided and dissipated. Perhaps it's time for the shadow to once again cover [aranore|e]."
 wed_intro.01.a: "Time for us to make a comeback."
 
 wed_intro.02.t: "The Guild of Elements."
 wed_intro.02.desc: "The Guild of Elements is a loose alliance of [elves|e] founded in the [secondage|e] by the Blue [wizards|E] to help counter the [courtofardor|e] in the Utter South, eventually culminating in a climactic battle with the court in [ageTA|e] 1414, coinciding with a [kinnlai|e] sponsored rebellion in Tandurak. together we managed to stop [GetScriptedCharacterByHistoryID('lineofardana1').GetFirstName] and [GetScriptedCharacterByHistoryID('lineoffankil').GetFirstName] before they were able to challenge [ariencharacter|e] and [tilioncharacter|e]. \n\nSince our victory, the court was shattered, losing most of its influence along with its leader, however [fankil|e] and my sister [GetScriptedCharacterByHistoryID('lineofardana3').GetFirstName] were rumored to escape. As such, the guild adopted a vigilant stance, standing guard in case the Court or the [darklord|e] ever rose again."
 wed_intro.02.a: "We'll rise to meet the shadow."
 
 wed_intro.03.t: "The Blue Wizards."
 wed_intro.03.desc: "It has been millennia since the [wizards|E] [alatarcharacter|e] and [pallandocharacter|e] were seen in the west. Trusting that the other members of the order could watch over the ancient ruins of Mordor, the few remaining [noldorelves|E], and [dunedain|E]. The Blue Wizards sent out East and South to convert and redeem the [men|E] and [dwarves|E] who had fallen to the [darklord|e], and restore [hope|e] to the [elves|e] who hadn't heard from the [valargods|e] since the [warofwrath|e]. \n\nTheir greatest achievements were the conversion of [khy|E], and the defeat of the [courtofardor|e], but they also played a role in revealing [sauroncharacter|e]s involvement with the [ironfists|e] and preserved what they could of Womaw. \n\nCurrently [alatarcharacter|e] is in Thani-Hazad, attempting to lay the ground work to either redeem or destroy the princes of the [balan_lai|E], while [pallandocharacter|e] is in Koronande, helping them resist sauronic influences from Mumakan."
 wed_intro.03.a: "We Will Never Tire."
 
 
 wed_intro.05.t: "Everyone wants to be a cat."
 wed_intro.05.desc: "One of the [fuim|e], the fallen [fay|e] of [melkorcharacter|e], [ROOT.Char.GetFirstName] was a servant of the shadow since the beginning, serving first Morgoth, then later [sauroncharacter|e] once Morgoth fell in the [warofwrath|e]. \n\nWhile he served the Dark Lord willingly enough, he was often fickle and hard to control, and unlike most of the [maiargods|e] who sided with the [darklord|e], [ROOT.Char.GetFirstName] didn't seem to really desire wealth or power, just the freedom to do what he wanted when he wanted, making him notoriously hard to control. Given his dearth of options, Sauron decided to mostly let the Prince of Cats be, content knowing that he was making trouble for the free peoples somewhere."
 wed_intro.05.a: "It's Playtime."
 
 wed_intro.06.t: "The Flame of Udun"
 wed_intro.06.desc: "Durins Bane has long dwelt in the black pit of [moria|e], festering in the dark with the [orcs|e] and [goblins|e] of the [mistymountain|e]s, but things are changing, He can once again feel the call of the [darklord|e] and though he is not his true master, [sauroncharacter|e] is a known quantity and the true heir of [morgothcharacter|e]. however its up to the [balrog|e] to decided who to serve..."
 wed_intro.06.a: "All Shall Perish"
 
 ### Ardor
 
 wed_ardor.01.t: "The Revenge of Aranórë"
 wed_ardor.01.desc: "In the long millennia since our failed ritual, the [courtofaranore|E] floundered, reduced to barely controlling the island of [ardinak|e], we could do nothing but wait, and plot, and scheme, waiting for the day we would have our revenge. \n\nThat time is now! The [court of Aranore |E] rises triumphant over our enemies. The [kinnlai|e] have been subdued, their holy places desecrated, the dread fortresses have been rebuilt, our loyal [men|E] serve at our beck and call. We have truly reached a new zenith! \n\nNow the only force in all of [arda|E] that can truly rival us is the [darklord|e] himself."
 wed_ardor.01.a: "We will never fall again!"
 
 wed_ardor.02.t: "The Dread Tower rises."
 wed_ardor.02.desc: "Mellenia ago, our forebarers attempted to slay [ariencharacter|e] and [tilioncharacter|e], but we were betrayed! At the critical moment, our ritual was disrupted and our hopes dashed. In the process, the blowback shattered the Citadel of [aranore|e], along with killing most of the high lords of the court. \n\n now centuries later the [courtofaranore|E] rises again! We have spread out across the region and restored our power. The Citadels tower rises into the night, the lords of the court once again rule from the tower, and we will never be deceived again!"
 wed_ardor.02.a: "Court is now in session."
 
 