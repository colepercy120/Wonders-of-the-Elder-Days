 ### Game concepts
 
 game_concept_magic: "Magic"
 game_concept_magical: "Magical"
 game_concept_magic_desc: "Magic is a broad category of secret knowledge and its application, mostly focusing on knowledge of the Unseen World and the [musicoftheainur|e], the specifically dark version is known as [sorcery|e]."
 
 game_concept_mage: "Mage"
 game_concept_mages: "Mages"
 game_concept_mage_desc: "Mages are a special type of [men_at_arms|e] that use their knowledge of [magic|e] to deal massive damage to their foes. They require lifelong training and thus are incredibly expensive."
 
 game_concept_courtofardor: "Court of Ardor"
 
 game_concept_courtofaranore: "Court of Aranórë"
 game_concept_courtofardor_desc: "Made up of [noldorelvesexiles|e] who fell to the influence of [morgothcharacter|e] in the [elderdays|e], the Court of Aranórë (or Ardor in [sindarin|e]) has worked to twist and corrupt the world since their master's destruction in the [warofwrath|e]. \n\nDuring the [secondage|e] they played a key roll in the corruption and later destruction of the [numenorean|e] colony of Tandurak, worked to inflame tensions amoung the [kinnlai|e] and struck an alliance with [fankil|e] and other fallen [maiagod|e]\n\nIn the mid [thirdage|e] the Court attempted to slay [ariencharacter|e] and [tilioncharacter|e] and destory the last fruits of the [twotrees|e] but were stopped by the [kinnlai|e], [alatarcharacter|e], and surprisingly [sauroncharacter|e] who didn't tolerate any rivals to his dominion. After the attempt failed, the court was left broken and shattered with little influence left in [arda|e]."
 
 game_concept_ardor: "Ardor"
 game_concept_ildol: "Ildol"
 game_concept_aranore: "Aranórë"
 game_concept_aranore_desc: "Also called [ardor|e] or [ildol|e], it means Exalted Land, or Desired Land. Aranórë describes the lands of the Utter South, historically inhabited by the [courtofaranore|e], the [kinnlai|e], the Uskani, and the [adunai|e] of Tandurak."
 
 game_concept_atalantli: "Atalanti"
 game_concept_atalanti: "Atalanti"
 game_concept_drow: "Drow"
 game_concept_atalantli_desc: "The Downfallen, also known as Drow, were [elves|e] who have fallen to the shadow, whether they were corrupted by [morgothcharacter|e], [sauroncharacter|e], or fell to their own devices. The Atalantli share a few things in common. Unlike other elves, they tend to be cruel, manipulative, and bellicose. However, aligning against their nature tends to shorten their lives, accelerating fading, burning through their life force faster than their kin, though this is only noticeable on the truly grand scale."
 
 game_concept_fuim: "Fuim"
 game_concept_unseelie: "Unseelie"
 game_concept_fuim_desc: "The Fuim, also known as the Unseelie Fey in [rohan|e] and the [shire|e] are the [fay|e] who were corrupted by [morgothcharacter|e], most of them were unhoused or taken to [valinor|e] after the [warofwrath|e] but those who remain tend to be the craftiest and most malevolent"
 
 ### MAA
 
 mages: "[mage|e]"
 
 battle_mages_elf: "Elven Bladesingers"
 battle_mages_elf_flavor: "Bladesingers are [eldar|e] [mages|e] who use a mix of swordfighting and songs of power to destroy their foes. They are notoriously rare and mostly found among the [caliquendielves|e]."
 battle_mages_dwarves: "Dwarven Evokers"
 battle_mages_dwarves_flavor: "Dwarven Evokers use knowledge of the unseen world to twist the stones of the earth to assist in excavation and mining, but their unique skills make them especially useful in battle."
 battle_mages_men: "Battle Mages"
 battle_mages_men_flavor: "Battle [mages|e] are humans trained in the limited use of magic specifically in combat, capable of casting illusions and twisting physics, they are the most fiercesome fighters humanity is able to field."
 
 werewolves: "Werewolves"
 werewolves_flavor: "Werewolves are dark wolves corrupted by [sauroncharacter|e] during the [elderdays|e], made to be bigger, badder, and totally subservient to his will"
 fellbeasts: "Fell Beast Riders"
 fellbeasts_flavor: "Riders of the Great Fell Beasts of the east of middle earth, they fire arrows, drop large objects, and just charge foes, while totally ignoring fixed defenses"
 eagles_maa: "Great Eagles"
 eagles_maa_flavor: "The Eagles of [manwecharacter|e], lesser [maiargods|e] who work to destory the darkness in the world. unmatched in the air and the only thing to rival [dragons|e]"
 ents: "Ents"
 ents_flavor: "[ents|e] of Fangorn forest, allied to the local ruler, they are tough in all situations, excellent in combat, and especially powerful against fortifications."
 
 summonwraiths: "Summoned Wraiths"
 summonwerewolves: "Summoned Werewolves"
 summonfellbeasts: "Summoned Fell Beasts"
 summonfey: "Summoned Fey"
