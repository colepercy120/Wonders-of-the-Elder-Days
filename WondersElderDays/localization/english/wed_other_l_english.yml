 ### Traits
 
 trait_mage: "Mage"
 trait_mage_1_desc: "A practitioner of [magic|e], Mages manipulate the world around them using secret knowledge of the arcane."
 trait_mage_1: "Hedge Mage"
 trait_mage_1_character_desc: "A minor practitioner of [magic|e], a hedge mage is skilled in mostly small-scale things, including medicine, minor conjurations, and banishing lesser spirits."
 trait_mage_2: "Mage"
 trait_mage_2_character_desc: "Mages are practicioners of [magic|e] that are proficent in the craft but not true masters. They are capable of many wondrous things, but not yet capable of truly legendary acts."
 trait_mage_3: "Master Mage"
 trait_mage_3_character_desc: "A True master of the mystic arts, Master Mages are capable of using [magic|e] to literally reshape the world around them, conjuring major spirits, and bending the laws of reality to their will?"
 trait_track_lifestyle_mage: "Mage"
 trait_track_lifestyle_mage_desc: "A practitioner of [magic|e], Mages manipulate the world around them using secret knowledge of the arcane."
 
 trait_fey: "Fay"
 trait_fey_desc: "Those beautiful spirits which descended into [middleearth|e] to help shape the World. They were numerous, yet not many were named, and few took visible shapes.\n\n[fay|e] were the least of the [maiargods|e] and the most numerous, with literal untold numbers of them across [middleearth|e]"
 
 trait_maiarindi: "Maiarindi"
 trait_maiarindi_desc: "A child of the [maiargods|e], while fully mortal they generally have improved health"
 trait_balrog: "Balrog"
 trait_balrog_desc: "A Demon of Shadow and Flame, The Balrogs were the strongest servents of [morgothcharacter|e] and his most feared weapons, each of them were a match for armies of elves or men and could level entire cities."
 
