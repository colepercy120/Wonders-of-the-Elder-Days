 innovation_mage_general: "Knowledge of the Unseen"
 innovation_mage_general_desc: "Encompassing the myriad secret knowledge and lore of the world, knowledge of the unseen represents a culture's knowledge of [magic|e] and [sorcery|e] along with the ability to use it on a mass scale."
