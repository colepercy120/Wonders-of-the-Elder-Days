 ### Nicknames
 
 nick_prince_cat: "Prince of Cats"
 nick_prince_cat_desc: "Tevildo was a lesser [maiargods|e], one of the [fay|e] who served [morgothcharacter|e] in the loosest sense, like the cats he ruled. He was notoriously fickle and hard to control, leading to [sauroncharacter|e] opting to keep him distracted in the utter south."
 
 nick_bane_of_palisor: "Bane of Palisor"
 nick_bane_of_palisor_desc: "Fankil led [morgothcharacter|e]s forces during the [battleofpalisor|e] during the [warofwrath|e], his body was slain in the battle, but he managed to reembody in the early [thirdage|e]"
 
 nick_the_astronomer: "the Astrologer"
 nick_the_astronomer_desc: "Ardana was the greatest [mage|e] amoung the [elves|e] [morgothcharacter|e] twisted to his will, she lead a group of [noldorelves|e] to the Utter South and attempted to destroy the Sun and Moon in the early [thirdage|e], falling to her son in the process."
 
 nick_black_wanderer: "The Wanderer in Black"
 nick_black_wanderer_desc: "Origionally thought to be still born, Morrana was abanoned shortly after birth, only to be discoverd by the wizards [pallandocharacter|e] and [alatarcharacter|e], Raised by them in the ways of the [valargods|e] Morrana lead the efforts against the [courtofaranore|e] in southern middle earth, eventually allying with his adoptive father and the [kinnlai|e] to organize a revolt amoung the courts slaves and stop the courts ritual, in the end he personally slew his mother and shattered the Citadel of Aranórë. Since then, he's worked against all servants of the shadow in southern Middle-earth, usually clad in black."
 
 nick_daughter_of_darkness: "Daughter of Darkness"
 nick_daughter_of_darkness_desc: "Despite her mother's claims to the contrary, Morelene was not truly the daughter of [morgothcharacter|e], however her true father, the [maiagod|e] [fankil|e], still provided her with a stronger soul than most [eldar|e]. Following the death of her mother during the ritual, Morelene rallied the remaining members of the [courtofaranore|e] and has been biding her time ever since."
 
#  nick_queen_air_dark: "Queen of Air and Darkness"
#  nick_queen_air_dark_desc: "Nixní, the Queen of Air and Darkness was one of [melkorcharacter|e]s cheif luitentents during the [elderdays|e], while not a match for [sauroncharacter|e] or even [fankil|e], she was known to be cold, callus, and incapable of telling a direct lie. \n\nKnown for her Bargins, she only served the shadow due to a deal she made with [melkorcharacter|e]. in later days [sauroncharacter|e] would turn to her to beckon in the Long Winter and later Fell Winter"
 
 nick_durins_bane: "Durin's Bane"
 nick_durins_bane_desc: "Udûnor was one of the last surviving [balrog|e]s, known for the destruction of [moria|e] he was eventually slain by [gandalfcharacter|e] at the end of the [thirdage|e]" 
 
