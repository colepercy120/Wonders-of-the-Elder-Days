 ### Faiths
 
 fallen_elven_religion: "Atalantli"
 fallen_elven_religion_adj: "Atalantli"
 fallen_elven_religion_desc: "The [atalanti|e], or the Downfallen, [elves|e] who have abandoned the light of the [valargods|e] and embraced [morgothcharacter|e] and later [sauroncharacter|e], they denounce [eru|e] and seek to dominate those around them."
 
 faith_ring_cult: "Annatari" # Faith of the Eldar
 faith_ring_cult_adj: "Annatari" # Faith of the Eldar
 faith_ring_cult_adherent: "Elda"
 faith_ring_cult_adherent_plural: "Eldar"
 faith_ring_cult_desc: "The people of [annatarcharacter|e], the Annatari are the [elves|e] who treat the [ringsofpower|e] as the ultimate gift, allowing them to hold off the flow of time and achieve [valinor|e] on earth. They see their subservience to [sauroncharacter|e] as a fair price, after all, the dark lord is the King of Men, not elves."
 
 faith_court_of_ardor: "Court of Ardor" # Faith of the Eldar
 faith_court_of_ardor_adj: "Ardorian" # Faith of the Eldar
 faith_court_of_ardor_adherent: "Ardorian"
 faith_court_of_ardor_adherent_plural: "Ardorians"
 faith_court_of_ardor_desc: "Shortly after the [noldorelvesexiles|e], [morgothcharacter|e] approached a group of [eldar|e] who he had corrupted in [valinor|e], he tasked them with destroying the Sun and Moon. those who survived the [warofwrath|e] regrouped in [ardor|e] and established the Court of Ardor to coordinate their efforts and maintain peace between their realms."
 
