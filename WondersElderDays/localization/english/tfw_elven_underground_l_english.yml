l_english:
 building_type_elven_hall_01: "Underground Elven Hall"
 building_type_elven_hall_01_desc: "A great refuge of the [elves|e] beneath the earth, where halls, gardens, workshops, and dwellings are carved into vast caverns and hidden from the wider world."
 building_elven_hall_01: "#high Underground Elven Sanctuary#!"
 building_elven_hall_01_desc: "Though the [elves|e] who dwell here are few in number, this subterranean [elven_sanctuary|e] bears the unmistakable mark of their presence, with crystal lamps, flowing water, and carefully tended gardens beneath the stone."
 building_elven_hall_02: "#high Vibrant Underground Elven Sanctuary#!"
 building_elven_hall_02_desc: "Small groups of [elvish|e] dwellings surround this subterranean [elven_sanctuary|e]. The Elves' presence grows increasingly apparent as carved roads and illuminated passages carry travelers and traders through the deep caverns."
 building_elven_hall_03: "#high Underground Elven Stronghold#!"
 building_elven_hall_03_desc: "Many of the most sophisticated parts of [elvish|e] civilization flourish within this underground [elven_stronghold|e], where great caverns house fine estates, libraries, halls, gardens, and fountains."
 building_elven_hall_04: "#high Notable Underground Elven Stronghold#!"
 building_elven_hall_04_desc: "An underground [elven_stronghold|e] of some renown, its name has become synonymous with the surrounding mountain and the halls beneath it, as more [elves|e] establish their homes within its deep chambers."
 building_elven_hall_05: "#high Great Underground Elven Stronghold#!"
 building_elven_hall_05_desc: "With stout gates, guarded passages, and vast vaulted chambers, the [elves|e] of the region have built a truly impressive [elven_stronghold|e]. Within its halls are many works of peerless worth and ancient lore."
 building_elven_hall_06: "#high Underground Elven City#!"
 building_elven_hall_06_desc: "A jewel of the [elves|e] beneath the earth, this [elven_city|e] is a true locus of power and wisdom. Its broad halls, gardens, workshops, and illuminated caverns rival the greatest settlements of the surface."
 building_elven_hall_07: "#high Legendary Underground Elven City#!"
 building_elven_hall_07_desc: "Few cities of [ardaconcept|e] can compare with this subterranean [elven_city|e] in size or majesty. Its endless halls and shining caverns exemplify the finest achievements of [elvish|e] civilization."
 building_type_elven_cavern_gardens_01: "Elven Cavern Gardens"
 building_type_elven_cavern_gardens_01_desc: "Beneath the earth, the [elves|e] coax life from stone and shadow, cultivating gardens by spring-water, crystal light, and patient care."
 building_elven_cavern_gardens_01: "Moss Gardens"
 building_elven_cavern_gardens_01_desc: "Small beds of moss, herbs, roots, and shade-loving plants are tended beside springs and lamp-lit chambers."
 building_elven_cavern_gardens_02: "Terraced Cavern Gardens"
 building_elven_cavern_gardens_02_desc: "Stone terraces have been cut into the cavern walls, allowing larger gardens to flourish wherever water may be guided."
 building_elven_cavern_gardens_03: "Lamp-Lit Groves"
 building_elven_cavern_gardens_03_desc: "Crystal lamps and reflected light allow delicate herbs, flowers, and fruit-bearing plants to thrive far beneath the open sky."
 building_elven_cavern_gardens_04: "Gardens of the Deep"
 building_elven_cavern_gardens_04_desc: "Whole chambers have been set aside for carefully tended gardens, providing food, medicine, and beauty to the halls."
 building_elven_cavern_gardens_05: "Verdant Caverns"
 building_elven_cavern_gardens_05_desc: "What were once bare caverns have become lush places of greenery, where trees, flowers, and vines grow among carved pools and streams."
 building_elven_cavern_gardens_06: "Gardens Beneath the Mountain"
 building_elven_cavern_gardens_06_desc: "Generations of careful cultivation have transformed the deep halls into a living landscape of orchards, herbs, flowing water, and shaded paths."
 building_elven_cavern_gardens_07: "Evergreen Deeps"
 building_elven_cavern_gardens_07_desc: "The greatest caverns bloom as though beneath an unseen spring, their gardens sustained by ancient [elven|e] skill and made beautiful beyond mortal imitation."
 building_type_elven_crystal_delvings_01: "Elven Crystal Delvings"
 building_type_elven_crystal_delvings_01_desc: "Rather than tear greedily at the earth, [elven|e] miners work with care and precision, following veins of crystal, ore, and precious stone through the living rock."
 building_elven_crystal_delvings_01: "Shallow Crystal Veins"
 building_elven_crystal_delvings_01_desc: "Small veins of crystal and ore close to the settled halls are worked carefully and with little disturbance to the surrounding stone."
 building_elven_crystal_delvings_02: "Shimmering Shafts"
 building_elven_crystal_delvings_02_desc: "New shafts follow bright seams deeper into the mountain, yielding greater quantities of useful ore and beautiful crystal."
 building_elven_crystal_delvings_03: "Gleaming Delvings"
 building_elven_crystal_delvings_03_desc: "Well-supported galleries wind through the rock, opening richer deposits while preserving the shape and beauty of the caverns."
 building_elven_crystal_delvings_04: "Crystal Galleries"
 building_elven_crystal_delvings_04_desc: "The mines themselves have become works of craft, their walls left glittering with exposed crystal and their passages shaped with [elven|e] care."
 building_elven_crystal_delvings_05: "Deep Gemworks"
 building_elven_crystal_delvings_05_desc: "Miners, cutters, and jewelers work side by side, bringing forth precious stones and refining them within workshops close to the delvings."
 building_elven_crystal_delvings_06: "Vaults of Living Crystal"
 building_elven_crystal_delvings_06_desc: "Vast chambers rich with crystal and mineral wealth are worked with great restraint, leaving much of their natural splendor intact."
 building_elven_crystal_delvings_07: "Treasures of the Deep"
 building_elven_crystal_delvings_07_desc: "The richest veins beneath the halls are known and carefully tended, yielding gems and metals of legendary quality without despoiling the mountain."
 building_type_elven_deep_markets_01: "Elven Deep Markets"
 building_type_elven_deep_markets_01_desc: "Within the underground halls, broad chambers and galleries become places of trade, art, conversation, and exchange."
 building_elven_deep_markets_01: "Passage Markets"
 building_elven_deep_markets_01_desc: "Small stalls gather at busy junctions where craftsmen, growers, and travelers exchange their wares."
 building_elven_deep_markets_02: "Cavern Bazaars"
 building_elven_deep_markets_02_desc: "Permanent stalls and workshops line widened passages, drawing regular trade from across the underground settlement."
 building_elven_deep_markets_03: "Markets of the Halls"
 building_elven_deep_markets_03_desc: "Broad market chambers have become centers of commerce where crafts, foodstuffs, and imported goods change hands."
 building_elven_deep_markets_04: "Grand Deep Markets"
 building_elven_deep_markets_04_desc: "Merchants and artisans fill carefully planned halls whose galleries and side chambers are dedicated to trade."
 building_elven_deep_markets_05: "Galleries of Exchange"
 building_elven_deep_markets_05_desc: "Entire networks of connected caverns are given over to workshops, storehouses, stalls, and meeting places."
 building_elven_deep_markets_06: "Markets Beneath the Mountain"
 building_elven_deep_markets_06_desc: "A sophisticated commercial quarter serves nobles, artisans, travelers, and merchants arriving from distant lands."
 building_elven_deep_markets_07: "Great Halls of Exchange"
 building_elven_deep_markets_07_desc: "The markets beneath the mountain are famed abroad for the beauty of their wares, the skill of their craftsmen, and the wealth that passes through them."
 building_type_elven_deep_forges_01: "Elven Deep Forges"
 building_type_elven_deep_forges_01_desc: "Hidden beneath the earth, [elven|e] smiths maintain carefully ventilated forges where mundane tools and peerless works are wrought alike."
 building_elven_deep_forges_01: "Cavern Smithies"
 building_elven_deep_forges_01_desc: "Small smithies provide the halls with nails, fittings, tools, and simple arms."
 building_elven_deep_forges_02: "Ventilated Forges"
 building_elven_deep_forges_02_desc: "Carefully designed vents carry smoke and heat away from the inhabited halls, allowing larger forges to operate safely."
 building_elven_deep_forges_03: "Forges of the Halls"
 building_elven_deep_forges_03_desc: "Purpose-built forge chambers house skilled smiths and their apprentices, producing arms and tools of fine quality."
 building_elven_deep_forges_04: "Great Deep Forges"
 building_elven_deep_forges_04_desc: "Large forge complexes support armorers, weaponsmiths, metalworkers, and other master craftsmen."
 building_elven_deep_forges_05: "Forges Beneath the Mountain"
 building_elven_deep_forges_05_desc: "Powerful furnaces and ancient techniques allow the smiths here to work large quantities of metal without sacrificing quality."
 building_elven_deep_forges_06: "Masterwork Forges"
 building_elven_deep_forges_06_desc: "The finest smiths of the halls labor in carefully planned workshops where every tool and furnace has been refined over generations."
 building_elven_deep_forges_07: "Forges of Undying Flame"
 building_elven_deep_forges_07_desc: "Legendary forges burn in the deepest halls, producing works of extraordinary strength, beauty, and refinement."
 building_type_elven_echoing_halls_01: "Elven Echoing Halls"
 building_type_elven_echoing_halls_01_desc: "Great communal chambers form the heart of underground [elven|e] life, hosting song, counsel, ceremony, learning, and celebration."
 building_elven_echoing_halls_01: "Gathering Chambers"
 building_elven_echoing_halls_01_desc: "Simple shared chambers provide a place for the inhabitants of the halls to gather, speak, and sing together."
 building_elven_echoing_halls_02: "Gathering Halls"
 building_elven_echoing_halls_02_desc: "Larger public halls have been set aside for communal meals, music, councils, and celebrations."
 building_elven_echoing_halls_03: "Halls of Song"
 building_elven_echoing_halls_03_desc: "Music carries beautifully through the shaped stone, and these halls have become beloved places of performance and remembrance."
 building_elven_echoing_halls_04: "Great Echoing Halls"
 building_elven_echoing_halls_04_desc: "Grand communal chambers link the scattered quarters of the settlement and serve as centers of public life."
 building_elven_echoing_halls_05: "Halls of Memory"
 building_elven_echoing_halls_05_desc: "Stories, songs, and the memory of generations are preserved in halls whose walls are carved and painted with scenes of ages past."
 building_elven_echoing_halls_06: "Halls of the People"
 building_elven_echoing_halls_06_desc: "Vast civic chambers host councils, feasts, instruction, festivals, and the daily affairs of the underground community."
 building_elven_echoing_halls_07: "Halls Without End"
 building_elven_echoing_halls_07_desc: "A magnificent network of public halls forms the cultural heart of the realm, filled always with song, memory, and the voices of its people."
 building_type_elven_subterranean_barracks_01: "Elven Subterranean Barracks"
 building_type_elven_subterranean_barracks_01_desc: "Barracks and guard halls placed throughout the underground settlement house warriors trained to defend narrow passages, gates, and cavern approaches."
 building_elven_subterranean_barracks_01: "Passage Guardrooms"
 building_elven_subterranean_barracks_01_desc: "Small guardrooms near the principal passages provide quarters for those who keep watch over the halls."
 building_elven_subterranean_barracks_02: "Deep Barracks"
 building_elven_subterranean_barracks_02_desc: "Expanded barracks allow a larger permanent guard to be stationed throughout the underground settlement."
 building_elven_subterranean_barracks_03: "Barracks of the Halls"
 building_elven_subterranean_barracks_03_desc: "Well-equipped garrisons stand ready near important gates, passages, and public chambers."
 building_elven_subterranean_barracks_04: "Great Subterranean Barracks"
 building_elven_subterranean_barracks_04_desc: "Professional soldiers are housed close to strategic junctions, able to respond quickly to threats from any direction."
 building_elven_subterranean_barracks_05: "Guard Halls"
 building_elven_subterranean_barracks_05_desc: "Elite defenders train constantly for battle in tunnels, chambers, stairways, and narrow approaches."
 building_elven_subterranean_barracks_06: "Barracks Beneath the Mountain"
 building_elven_subterranean_barracks_06_desc: "A disciplined permanent force guards the sprawling city, supplied by armories and storehouses integrated into the barracks."
 building_elven_subterranean_barracks_07: "Halls of the Deep Guard"
 building_elven_subterranean_barracks_07_desc: "The finest warriors of the realm keep ceaseless watch from vast fortified barracks throughout the deepest halls."
 building_type_elven_warded_passages_01: "Elven Warded Passages"
 building_type_elven_warded_passages_01_desc: "The [elves|e] make the natural strength of the underground halls greater still, protecting their passages with gates, hidden defenses, and carefully prepared chokepoints."
 building_elven_warded_passages_01: "Watched Passages"
 building_elven_warded_passages_01_desc: "The most important tunnels are patrolled and watched from small hidden posts."
 building_elven_warded_passages_02: "Guarded Passages"
 building_elven_warded_passages_02_desc: "Gates and permanent watch posts protect the busiest entrances and junctions."
 building_elven_warded_passages_03: "Sealed Ways"
 building_elven_warded_passages_03_desc: "Strong doors, concealed barriers, and prepared chokepoints protect the inner halls from sudden assault."
 building_elven_warded_passages_04: "Wards of the Deep"
 building_elven_warded_passages_04_desc: "Layered defenses guard every important approach, forcing an enemy to fight for each passage."
 building_elven_warded_passages_05: "Hidden Defenses"
 building_elven_warded_passages_05_desc: "Secret gates, concealed firing positions, and false passages make the ways difficult for any outsider to navigate safely."
 building_elven_warded_passages_06: "Labyrinthine Wards"
 building_elven_warded_passages_06_desc: "The approaches to the halls have become a maze of guarded paths, sealed chambers, and deliberately misleading passages."
 building_elven_warded_passages_07: "Unbreakable Ways"
 building_elven_warded_passages_07_desc: "Generations of [elven|e] engineering have rendered the deepest approaches nearly impossible to force without terrible cost."
 building_type_elven_cavern_fletchers_01: "Elven Cavern Fletchers"
 building_type_elven_cavern_fletchers_01_desc: "Bowyers and fletchers within the underground halls craft weapons suited to both open battle and the narrow confines of the deep."
 building_elven_cavern_fletchers_01: "Cavern Fletchers"
 building_elven_cavern_fletchers_01_desc: "Small groups of bowyers and fletchers maintain bows and arrows for the guards of the underground halls."
 building_elven_cavern_fletchers_02: "Deep Bowyers"
 building_elven_cavern_fletchers_02_desc: "Dedicated workshops produce greater quantities of bows, arrows, and specialized missile equipment."
 building_elven_cavern_fletchers_03: "Fletchers of the Halls"
 building_elven_cavern_fletchers_03_desc: "Skilled craftsmen supply the garrison with reliable weapons designed for use in tunnels and chambers."
 building_elven_cavern_fletchers_04: "Great Cavern Fletchers"
 building_elven_cavern_fletchers_04_desc: "Large workshops equip whole companies of archers and skirmishers with finely balanced weapons."
 building_elven_cavern_fletchers_05: "Bowyers Beneath the Mountain"
 building_elven_cavern_fletchers_05_desc: "Exceptional bows and arrows are crafted here, designed to remain deadly even where space is limited."
 building_elven_cavern_fletchers_06: "Master Fletchers"
 building_elven_cavern_fletchers_06_desc: "The finest bowyers refine every part of their craft, from the shaping of the bow to the balance and flight of each arrow."
 building_elven_cavern_fletchers_07: "Fletchers of the Deep Guard"
 building_elven_cavern_fletchers_07_desc: "Legendary craftsmen supply the elite defenders of the halls with bows and arrows of unmatched precision."
 building_type_elven_hall_fortifications_01: "Elven Hall Fortifications"
 building_type_elven_hall_fortifications_01_desc: "The hidden strength of the underground halls is reinforced by gates, bastions, guarded chambers, and defensive works shaped directly into the mountain."
 building_elven_hall_fortifications_01: "Guarded Entrances"
 building_elven_hall_fortifications_01_desc: "Simple gates and watch posts protect the main approaches to the underground settlement."
 building_elven_hall_fortifications_02: "Fortified Passages"
 building_elven_hall_fortifications_02_desc: "Reinforced gates and stone defenses make the principal passages far more difficult to force."
 building_elven_hall_fortifications_03: "Warded Gates"
 building_elven_hall_fortifications_03_desc: "Strong gates, defensive galleries, and carefully planned approaches guard the deeper halls."
 building_elven_hall_fortifications_04: "Deep Bastions"
 building_elven_hall_fortifications_04_desc: "Subterranean bastions command the main passages and provide secure positions from which defenders may hold back larger forces."
 building_elven_hall_fortifications_05: "Fortresses of Stone"
 building_elven_hall_fortifications_05_desc: "Layered gates, fortified chambers, and prepared killing grounds turn the halls into a formidable stronghold."
 building_elven_hall_fortifications_06: "Great Wards of the Deep"
 building_elven_hall_fortifications_06_desc: "Massive defensive works protect every major approach to the city, with fallback positions prepared far into the mountain."
 building_elven_hall_fortifications_07: "Unassailable Halls"
 building_elven_hall_fortifications_07_desc: "A masterwork system of gates, bastions, concealed defenses, and narrow approaches makes these halls among the strongest fortresses beneath the earth."
 elven_hall_holding_concept_key: "[elven_refuge|e]"
 elven_hall_holding: "Elven Hall"
